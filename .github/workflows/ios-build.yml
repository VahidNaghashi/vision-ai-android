
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios:
    name: Build iOS Simulator App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --no-codesign

      - name: Build for physical iPhone (unsigned)
        run: flutter build ios --release --no-codesign


      - name: Package unsigned iPhone IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -q -r VisionAI-unsigned.ipa Payload

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: VisionAI-iPhone-unsigned
          path: VisionAI-unsigned.ipa
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-ai-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
